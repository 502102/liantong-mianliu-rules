[script]
script = |
  function main(config)
    for _, proxy in ipairs(config.proxies or {}) do
      if proxy.plugin_opts and proxy.plugin_opts.host then
        proxy.plugin_opts.host = proxy.plugin_opts.host:gsub("tms.dingtalk.com", "upay.10010.com")
      end
      if proxy.sni then
        proxy.sni = proxy.sni:gsub("tms.dingtalk.com", "upay.10010.com")
      end
    end
    return config
  end
